<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical_url }}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical_url }}">
<meta property="og:site_name" content="Guide Me Xian">
<meta property="og:locale" content="zh_CN">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.min.css"
crossorigin="" />
<script src="https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.min.js"
crossorigin=""></script>
</head>
<body>
<header class="site-header">
<div class="site-header-inner">
<a class="site-title" href="/">Guide Me Xian</a>
<nav class="breadcrumb">
<a href="/">Guide Me Xian</a> <span class="sep">/</span>
<a href="/xian/">西安</a> <span class="sep">/</span>
<span class="current">{{ article_title_plain }}</span>
</nav>
</div>
</header>
<main>
<article class="article">
<header class="article-header">
<div class="article-group">
<span class="dot" style="background:#{{ category_color }}"></span>
<span class="group-label">{{ category }}</span>
</div>
<h1 class="article-title">{{ title }}</h1>
<p class="article-subtitle">{{ subtitle }}</p>
</header>
<div class="article-locmap-wrap">
<div id="article-locmap"></div>
<p class="article-locmap-hint">大致位置。 <a href="/xian/#city-map">在城市地图里看</a></p>
</div>
<div class="article-body">
{{ body }}
</div>
<nav class="article-foot-nav">
<a href="/xian/">← 回到《怎么看懂西安》</a>
</nav>
</article>
</main>
<footer class="site-footer">
<div class="site-footer-inner">
<p>Guide Me Xian · 西安现场观察手册</p>
</div>
</footer>
<script>
(function(){
var map = L.map('article-locmap', {
scrollWheelZoom: false,
dragging: true,
zoomControl: true,
doubleClickZoom: false
}).setView([{{ lat }}, {{ lng }}], 14);
L.tileLayer('https://wprd0{s}.is.autonavi.com/appmaptile?x={x}&y={y}&z={z}&lang=zh_cn&size=1&scale=1&style=7', {
    subdomains: "1234",
    maxZoom: 18,
    attribution: '&copy; <a href="https://lbs.amap.com/" target="_blank" rel="noopener noreferrer">高德地图</a>'
}).addTo(map);
L.circleMarker([{{ lat }}, {{ lng }}], {
radius: 9,
color: "#{{ category_color }}",
weight: 3,
fillColor: "#{{ category_color }}",
fillOpacity: 0.85
}).addTo(map).bindTooltip("{{ article_title_plain }}", {permanent: false, direction: 'top'});
})();
</script>
</body>
</html>
